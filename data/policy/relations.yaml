# =============================================================================
# 政策关系图谱（data/policy/relations.yaml）——「变化轨迹 · 关联图谱」
#
# 边方向语义（重要，loader 与 graph.ts 都依赖这个约定）：
#   from 是「动作发出方」，to 是「动作承受方」。
#     amends      from 修改了 to          （例：国发〔2023〕13号 修改 国发〔2018〕41号）
#     supersedes  from 替代了 to          （例：2023年第7号 替代 财税〔2018〕99号）
#     repeals     from 废止了 to          （例：增值税法 废止 增值税暂行条例）
#     based_on    from 的制定依据是 to     （例：2023年第7号 依据 企业所得税法）
#     implements  from 是对 to 的贯彻落实  （例：税务总局2019年第14号 贯彻 2019年第39号）
#     parallel    from 与 to 关联平行      （无方向语义，取任一端均可）
#
# 所有 from / to 必须是 policies.yaml 中真实存在的 id；
# buildGraph 会做严格校验，出现悬空 id 直接抛 PolicyGraphError（不允许静默丢边）。
#
# 说明：本文件只记录「有公开文本支持」的关系。推断性关系一律用 parallel，
#       并在 note 中写明「关联」而不是「依据」，避免误导使用者。
# =============================================================================

