    summary: 允许先进制造业企业按当期可抵扣进项税额加计5%抵减应纳增值税税额，执行至2027年底。
    keyPoints:
      - 适用对象为高新技术企业中的制造业一般纳税人，名单由省级工信部门会同有关部门确定。
      - 按当期可抵扣进项税额的5%计提加计抵减额。
      - 加计抵减额只能抵减应纳税额，不得结转下期继续抵减。
      - 政策执行期为2023年1月1日至2027年12月31日。
    tags: [增值税, 加计抵减, 先进制造业, 优惠]

