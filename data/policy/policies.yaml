    keyPoints:
      - 月销售额10万元以下（按季30万元以下）的小规模纳税人免征增值税。
      - 适用3%征收率的应税销售收入减按1%征收率征收。
      - 执行期为2023年1月1日至2023年12月31日，后续由2023年第19号延续。
    tags: [增值税, 小规模纳税人, 减免, 2023年]

