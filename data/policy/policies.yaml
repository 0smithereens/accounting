  - id: ann-2019-39
    documentNo: 财政部 税务总局 海关总署公告2019年第39号
    title: 财政部 税务总局 海关总署关于深化增值税改革有关政策的公告
    issuer: 财政部 国家税务总局 海关总署
    issuedAt: 2019-03-20
    effectiveFrom: 2019-04-01
    lifecycle: effective
    level: central
    taxCodes: [vat]
    summary: 2019年深化增值税改革的核心文件，下调税率、扩大进项抵扣范围并引入加计抵减与留抵退税。
    keyPoints:
      - 原16%税率降为13%，原10%税率降为9%，6%一档保持不变。
      - 允许不动产进项税额一次性全额抵扣，不再分两年抵扣。
      - 对生产、生活性服务业纳税人实行进项税额加计抵减。
      - 试行增值税期末留抵税额退税制度。
    tags: [增值税, 税率调整, 加计抵减, 留抵退税]

  - id: ann-2023-1
