    summary: 增值税的基础行政法规，确立一般计税方法与简易计税方法，2026年起由增值税法取代。
    keyPoints:
      - 销售货物、提供加工修理修配劳务及进口货物的单位和个人为纳税人。
      - 一般纳税人适用税率计税并可抵扣进项税额，小规模纳税人适用征收率。
      - 规定了免税项目、起征点与纳税义务发生时间等基本制度。
    tags: [增值税, 行政法规, 已废止]

  - id: caishui-2016-36
    documentNo: 财税〔2016〕36号
    title: 财政部 国家税务总局关于全面推开营业税改征增值税试点的通知
