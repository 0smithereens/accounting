# =============================================================================
# 政策库数据集（data/policy/policies.yaml）
#
# 收录范围：中国现行税收法律、行政法规、部门规章与重要规范性文件，
#           以及与「记账—报税」直接相关的会计法规。
#
# 数据约定（loader 会强校验）：
#   id           小写字母/数字/连字符，全库唯一，被 relations / families / business-events 引用
#   documentNo   文号；文号规范化后允许「财税〔2016〕36号 / 财税[2016]36号」等价检索
#   issuedAt     发布日期（成文/公布日期）
#   effectiveFrom 施行日期；追溯执行的公告（如2023年第19号）可早于发布日期
#   effectiveTo  失效日期（含当日）；未废止则不填
#   lifecycle    effective 现行有效 / amended 已修改 / superseded 已被替代 / repealed 已废止 / draft 草案
#   level        central 中央 / local 地方（地方必须标 region）
#   taxCodes     19 个税种编码，见 src/policy/library.ts 的 POLICY_TAX_CODES
#
# 准确性说明：文号、发文机关、发布日期、施行日期均按公开发布信息填写；
#             涉及具体条文计算的表述只写到「制度要点」层面，不复制法条原文，
#             实际适用一律以官方发布文本与主管税务机关口径为准。
# =============================================================================

version: 1
