  - id: vat-law-2024
    documentNo: 中华人民共和国主席令第四十一号
    title: 中华人民共和国增值税法
    issuer: 全国人民代表大会常务委员会
    issuedAt: 2024-12-25
    effectiveFrom: 2026-01-01
    lifecycle: effective
    level: central
    taxCodes: [vat]
    url: https://www.gov.cn/yaowen/liebiao/202412/content_6994557.htm
    summary: 我国第一部增值税法，把营改增以来形成的增值税制度上升为法律，自2026年1月1日起施行。
    keyPoints:
      - 在境内销售货物、服务、无形资产、不动产以及进口货物的单位和个人为增值税纳税人。
      - 维持 13%、9%、6% 三档税率与小规模纳税人简易计税的制度框架。
      - 对小规模纳税人、起征点、免税项目和留抵退税等作出法律规定。
      - 自2026年1月1日起施行，《中华人民共和国增值税暂行条例》同时废止。
    tags: [增值税, 法律, 2026年施行, 税制改革]

  - id: vat-interim-regulation
    documentNo: 国务院令第538号
    title: 中华人民共和国增值税暂行条例
    issuer: 国务院
    issuedAt: 2008-11-10
    effectiveFrom: 2009-01-01
    effectiveTo: 2025-12-31
