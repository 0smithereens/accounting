      - 进口关税设置最惠国税率、协定税率、特惠税率、普通税率等。
      - 完税价格以成交价格为基础确定，进口环节增值税、消费税由海关一并征收。
      - 自2024年12月1日起施行。
    tags: [关税, 法律, 进出口, 2024年施行]

  - id: farmland-law
    documentNo: 中华人民共和国主席令第十八号
    title: 中华人民共和国耕地占用税法
    issuer: 全国人民代表大会常务委员会
    issuedAt: 2018-12-29
    effectiveFrom: 2019-09-01
    lifecycle: effective
    level: central
    taxCodes: [farmland]
    url: https://www.gov.cn/xinwen/2018-12/30/content_5353479.htm
    summary: 耕地占用税的法律依据，对占用耕地建房或从事非农业建设的单位和个人按面积定额征收。
    keyPoints:
      - 在境内占用耕地建房或者从事非农业建设的单位和个人为纳税人。
      - 以纳税人实际占用的耕地面积为计税依据，按规定的适用税额一次性征收。
      - 占用基本农田的，适用税额应当在规定基础上提高。
    tags: [耕地占用税, 法律, 土地]

  - id: tobacco-law
    documentNo: 中华人民共和国主席令第八十四号
    title: 中华人民共和国烟叶税法
    issuer: 全国人民代表大会常务委员会
    issuedAt: 2017-12-27
    effectiveFrom: 2018-07-01
    lifecycle: effective
    level: central
    taxCodes: [tobacco]
    summary: 烟叶税的法律依据，对收购烟叶的单位按收购金额的20%征收。
    keyPoints:
      - 在境内收购烟叶的单位为烟叶税纳税人。
      - 税率为20%，计税依据为纳税人收购烟叶实际支付的价款总额。
      - 烟叶税由收购地税务机关征收。
    tags: [烟叶税, 法律, 农业特产]

