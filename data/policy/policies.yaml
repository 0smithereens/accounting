  - id: sh-property-pilot
    documentNo: 沪府发〔2011〕3号
    title: 上海市开展对部分个人住房征收房产税试点的暂行办法
    issuer: 上海市人民政府
    issuedAt: 2011-01-27
    effectiveFrom: 2011-01-28
    lifecycle: effective
    level: local
    region: "310000"
    taxCodes: [property]
    summary: 上海市对部分个人住房征收房产税试点的地方性规定，是全国个人住房房产税试点的两个样本之一。
    keyPoints:
      - 对本市居民家庭新购且属于第二套及以上的住房、非本市居民家庭新购住房征收房产税。
      - 计税依据为住房市场交易价格的70%，适用税率暂定为0.6%，符合条件可减按0.4%。
      - 本市居民家庭人均住房面积不超过60平方米的部分免税。
      - 具体认定与征收口径以主管税务机关发布为准。
    tags: [房产税, 地方政策, 上海, 个人住房试点]

  - id: cq-property-pilot
    documentNo: 渝府令〔2017〕311号
    title: 重庆市人民政府关于修订《重庆市关于开展对部分个人住房征收房产税改革试点的暂行办法》和《重庆市个人住房房产税征收管理实施细则》的决定
