    issuedAt: 2017-12-27
    effectiveFrom: 2018-07-01
    lifecycle: effective
    level: central
    taxCodes: [tonnage]
    summary: 船舶吨税的法律依据，对自境外港口进入境内港口的船舶按净吨位与执照期限征收。
    keyPoints:
      - 自中华人民共和国境外港口进入境内港口的船舶为吨税征税对象。
