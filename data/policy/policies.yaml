  - id: cit-law
    documentNo: 中华人民共和国主席令第六十三号
    title: 中华人民共和国企业所得税法
    issuer: 全国人民代表大会
    issuedAt: 2007-03-16
    effectiveFrom: 2008-01-01
    lifecycle: amended
    level: central
    taxCodes: [cit]
    summary: 统一内外资企业所得税的基本法律，确立25%法定税率、税前扣除与税收优惠的基本框架。
    keyPoints:
      - 居民企业就境内外所得纳税，非居民企业就来源于中国境内所得纳税。
      - 法定税率25%，符合条件的小型微利企业与高新技术企业适用优惠税率。
      - 规定不得扣除项目、亏损弥补期限与关联交易特别纳税调整。
      - 2017年、2018年分别对部分条款作了修正。
    tags: [企业所得税, 法律, 基本法]

