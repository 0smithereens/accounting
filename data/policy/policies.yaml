    summary: 将企业研发费用加计扣除比例由50%提高到75%，并允许在2018年至2020年期间执行。
    keyPoints:
      - 未形成无形资产计入当期损益的研发费用，按实际发生额的75%在税前加计扣除。
      - 形成无形资产的，按无形资产成本的175%在税前摊销。
      - 政策执行期为2018年1月1日至2020年12月31日，后续由2023年第7号提高至100%。
