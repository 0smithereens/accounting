  # ---------------------------------------------------------------------------
  # 所有者权益变动表（报告式：按权益组成部分列示年初、变动、年末）
  # 「其中：净利润」单列说明，不重复计入变动合计。
  # ---------------------------------------------------------------------------
  equity_change:
    title: 所有者权益变动表
    rows:
      - { code: "H1", key: EQ-H-OPEN, label: 一、上年年末余额, level: 0, rule: { kind: header } }
      - { code: "1", key: EQ-OPEN-PAID, label: 实收资本（或股本）, level: 1, rule: { kind: accounts, codes: ["4001"], sign: credit, source: opening } }
      - { code: "2", key: EQ-OPEN-CAP, label: 资本公积, level: 1, rule: { kind: accounts, codes: ["4002"], sign: credit, source: opening } }
      - { code: "3", key: EQ-OPEN-SURPLUS, label: 盈余公积, level: 1, rule: { kind: accounts, codes: ["4101"], sign: credit, source: opening } }
      - { code: "4", key: EQ-OPEN-RETAINED, label: 未分配利润, level: 1, rule: { kind: accounts, codes: ["4103", "4104"], sign: credit, source: opening } }
      - { code: "5", key: EQ-OPEN-TOTAL, label: 上年年末余额合计, level: 1, isTotal: true, rule: { kind: sum, of: ["EQ-OPEN-PAID", "EQ-OPEN-CAP", "EQ-OPEN-SURPLUS", "EQ-OPEN-RETAINED"] } }

      - { code: "H2", key: EQ-H-MOVE, label: 二、本年增减变动金额（减少以“-”号填列）, level: 0, rule: { kind: header } }
      - { code: "6", key: EQ-MOV-PAID, label: 实收资本（或股本）, level: 1, rule: { kind: diff, of: ["EQ-CLOSE-PAID", "EQ-OPEN-PAID"] } }
      - { code: "7", key: EQ-MOV-CAP, label: 资本公积, level: 1, rule: { kind: diff, of: ["EQ-CLOSE-CAP", "EQ-OPEN-CAP"] } }
      - { code: "8", key: EQ-MOV-SURPLUS, label: 盈余公积, level: 1, rule: { kind: diff, of: ["EQ-CLOSE-SURPLUS", "EQ-OPEN-SURPLUS"] } }
      - { code: "9", key: EQ-MOV-RETAINED, label: 未分配利润, level: 1, rule: { kind: diff, of: ["EQ-CLOSE-RETAINED", "EQ-OPEN-RETAINED"] } }
      - { code: "10", key: EQ-MOV-TOTAL, label: 本年增减变动金额合计, level: 1, isTotal: true, rule: { kind: sum, of: ["EQ-MOV-PAID", "EQ-MOV-CAP", "EQ-MOV-SURPLUS", "EQ-MOV-RETAINED"] } }
      - { code: "11", key: EQ-MOV-NP, label: 其中：净利润, level: 2, rule: { kind: sum, of: ["EQX-NET-PROFIT"] } }

      - { code: "H3", key: EQ-H-CLOSE, label: 三、本年年末余额, level: 0, rule: { kind: header } }
      - { code: "12", key: EQ-CLOSE-PAID, label: 实收资本（或股本）, level: 1, rule: { kind: accounts, codes: ["4001"], sign: credit, source: closing } }
      - { code: "13", key: EQ-CLOSE-CAP, label: 资本公积, level: 1, rule: { kind: accounts, codes: ["4002"], sign: credit, source: closing } }
      - { code: "14", key: EQ-CLOSE-SURPLUS, label: 盈余公积, level: 1, rule: { kind: accounts, codes: ["4101"], sign: credit, source: closing } }
      - { code: "15", key: EQ-CLOSE-RETAINED, label: 未分配利润, level: 1, rule: { kind: accounts, codes: ["4103", "4104"], sign: credit, source: closing } }
      - { code: "16", key: EQ-CLOSE-TOTAL, label: 本年年末余额合计, level: 1, isTotal: true, rule: { kind: sum, of: ["EQ-CLOSE-PAID", "EQ-CLOSE-CAP", "EQ-CLOSE-SURPLUS", "EQ-CLOSE-RETAINED"] } }
    checks:
      - id: EQ-BALANCE
        label: 本年年末余额 = 上年年末余额 + 本年增减变动金额
        actual: EQ-CLOSE-TOTAL
        expected: { sum: ["EQ-OPEN-TOTAL", "EQ-MOV-TOTAL"] }
      - id: EQ-COMPONENT
        label: 权益变动合计 = 各组成部分变动之和
        actual: EQ-MOV-TOTAL
        expected: { sum: ["EQ-MOV-PAID", "EQ-MOV-CAP", "EQ-MOV-SURPLUS", "EQ-MOV-RETAINED"] }
