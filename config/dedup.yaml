# =============================================================================
# 跨单据重复业务检测
# =============================================================================
# 为什么需要这个？
#   同一笔钱常常同时出现在两份文件里。例如「银行代发工资」既是银行流水的一行，
#   也是工资表「发放」环节对应的银行付款。如果两份文件都处理而不去重，就会：
#     · 应付职工薪酬出现异常借方余额
#     · 费用/收入金额翻倍
#
# 去重原则（保守）：金额必须完全一致 + 日期必须在窗口天数内，才判定为同一笔业务。
# 宁可漏判（留给人看告警），也不误判（悄悄吃掉一笔真实业务）。
#
# 每条配对规则包含：
#   keep / drop   两边的匹配条件，保留 keep 一侧、跳过 drop 一侧
#   windowDays    日期容差（天）
#   amountTolerance 金额容差（元），默认 0
#
# 匹配条件可用字段：
#   kinds            单据类型数组：bank / invoice / expense / payroll / contract
#   fields           专有字段精确匹配，如 { stage: payment }
#   summary          摘要包含任一关键字（同时匹配原始摘要）
#   amountField      用哪个字段的金额参与比对（默认用单据金额）
#                    例：工资表「发放」单据的总金额是应发工资，而银行代发的是实发工资，
#                    需要写 amountField: netPay 才能比对上。
# =============================================================================

enabled: true

pairs:
  # ---------------------------------------------------------------------------
  # 银行代发工资 ←→ 工资表的「发放」
  # 工资表能给出完整的代扣明细（个税/社保/公积金），信息更全，因此保留工资表一侧。
  # ---------------------------------------------------------------------------
  - id: payroll-payment-duplicate
    desc: 银行流水的「代发工资」与工资表生成的「发放工资」凭证是同一笔业务
    keep:
      kinds: [payroll]
      fields: { stage: payment }
      amountField: netPay
    drop:
      kinds: [bank]
      summary: [代发工资, 工资代发, 发放工资, 工资发放, 薪资代发, 批量代发工资, 代发薪, 代发工资款]
    windowDays: 10
    amountTolerance: 0.01

  # ---------------------------------------------------------------------------
  # 说明：报销单与银行「报销款」不需要去重。
  # 报销单默认按「先挂账、后付款」处理：
  #     报销单   → 借 费用，贷 2241.04 其他应付款-员工报销款
  #     银行付款 → 借 2241.04，贷 1002 银行存款
  # 两张凭证合起来才是完整业务，去掉任何一张都会导致科目余额错误。
  # 若你只处理报销单、不导入银行流水，请把 config/settings.yaml 里的
  # expenseCreditAccount 改成 "1002"。
  # ---------------------------------------------------------------------------
