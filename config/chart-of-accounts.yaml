# =============================================================================
# 会计科目表（企业会计准则 —— 常用科目）
# =============================================================================
# 字段说明：
#   code        科目编码，用 . 分隔层级，如 2221.01.01
#   name        科目名称
#   category    asset 资产 / liability 负债 / equity 所有者权益 / cost 成本 / profit 损益
#   balanceSide debit 借方余额 / credit 贷方余额（不填则按 category 推断）
#   parent      上级科目编码（不填则按编码自动推断）
#   leaf        是否为明细科目（不填则自动推断：有下级即非明细）
#   defaultChild 默认下钻的明细科目。当规则引用了带下级的上级科目时，
#                系统自动改用这里指定的明细科目，因此给银行账户增设明细后不必改规则。
#   auxiliary   允许的辅助核算维度：department/customer/supplier/employee/project
#   note        备注
#
# 规则里引用的科目编码必须在这里存在且为明细科目（leaf），否则生成凭证时会告警。
# 新增科目直接往下加即可，无需改代码。
# =============================================================================

