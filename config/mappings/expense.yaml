  # ----------------------------- 四、兜底 -----------------------------

  - id: expense-fallback
    desc: 未分类费用（兜底）
    kinds: [expense]
    priority: 100
    when:
      fieldContains: { category: [其他] }
    then:
      entries:
        - { side: debit, account: "6602.17", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }
    warn: "费用类别未能归入具体明细科目，已记 6602.17 管理费用-其他，建议在报销单中填写规范的「费用类别」"

  - id: expense-unknown-category
    desc: 出现未配置的费用类别
    kinds: [expense]
    priority: 90
    when:
      fieldContains: { category: [__NEVER_MATCH__] }
    then:
      entries:
        - { side: debit, account: "6602.17", amount: net, summary: "{summary}" }
        - { side: credit, account: "{field.creditAccount}", amount: total }
