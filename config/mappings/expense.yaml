  - id: expense-depreciation
    desc: 折旧摊销
    kinds: [expense]
    priority: 520
    when:
      fieldContains: { category: [折旧摊销] }
    then:
      entries:
        - { side: debit, account: "6602.09", amount: total, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: credit, account: "{field.creditAccount}", amount: total }
    warn: "折旧摊销不应通过银行存款支付，请改为 贷 1602 累计折旧 / 1702 累计摊销"

  - id: expense-financial
    desc: 财务费用类支出
    kinds: [expense]
