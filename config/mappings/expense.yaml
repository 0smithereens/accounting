        - { side: debit, account: "6602.05", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }

  - id: expense-rent
    desc: 租赁费
    kinds: [expense]
    priority: 520
    when:
      fieldContains: { category: [租赁费] }
    then:
      entries:
        - { side: debit, account: "6602.06", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
