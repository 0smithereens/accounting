# =============================================================================
# 报销单 / 费用明细 记账规则
# =============================================================================
# 提取器会把「费用类别」规范化后写入 field.category，可取值：
#   差旅费 业务招待费 办公费 水电费 租赁费 通讯费 运输费 车辆使用费 会议费
#   广告宣传费 咨询顾问费 研发费用 职工薪酬及福利 折旧摊销 财务费用 修理费 其他
#
# 关于「有/无进项税额」的处理（重要）：
#   报销单若不含可抵扣税额，提取器把 netAmount/taxAmount 留空，
#   此时 amount: net 取全额、amount: tax 取 0，税额分录会因为金额为 0 被自动删除。
#   因此每个类别只需要写一条规则，就能同时适配「有票抵扣」和「无票全额」两种情况。
#
# 科目归属默认按「管理费用」；销售部/市场部的费用会用更高优先级的规则改记「销售费用」。
# =============================================================================

name: 报销单规则

rules:
  # ------------------- 一、暂未付款的报销（挂其他应付款） -------------------

  - id: expense-unpaid
    desc: 报销已审批但尚未付款
    kinds: [expense]
    priority: 700
    when:
      summary: [未付款, 尚未支付, 待付款, 挂账, 未支付, 暂未支付]
    then:
      entries:
        - { side: debit, account: "6602.17", amount: net, summary: "{summary}" }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "2241.04", amount: total, summary: "应付员工报销款", auxiliary: { employee: "{field.employee}" } }
    warn: "已按「暂未付款」处理，费用挂 6602.17；请按费用类别调整借方明细科目"

  # ------------------------- 二、销售费用专项 -------------------------

  - id: expense-sales-travel
    desc: 销售部差旅费
    kinds: [expense]
    priority: 620
    when:
      fieldContains: { category: [差旅费], department: [销售部, 市场部, 销售, 市场, 商务部, 营销部] }
    then:
      entries:
        - { side: debit, account: "6601.03", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }

  - id: expense-sales-entertainment
    desc: 销售部业务招待费
    kinds: [expense]
    priority: 620
    when:
      fieldContains: { category: [业务招待费], department: [销售部, 市场部, 销售, 市场, 商务部, 营销部] }
    then:
      entries:
        - { side: debit, account: "6601.04", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }

  - id: expense-sales-office
    desc: 销售部办公费
    kinds: [expense]
    priority: 620
    when:
      fieldContains: { category: [办公费], department: [销售部, 市场部, 销售, 市场, 商务部, 营销部] }
    then:
      entries:
        - { side: debit, account: "6601.05", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }

  - id: expense-sales-ad
    desc: 广告宣传费
    kinds: [expense]
    priority: 610
    when:
      fieldContains: { category: [广告宣传费] }
    then:
      entries:
        - { side: debit, account: "6601.06", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }

  - id: expense-sales-freight
    desc: 运输费
    kinds: [expense]
    priority: 610
    when:
      fieldContains: { category: [运输费] }
    then:
      entries:
        - { side: debit, account: "6601.07", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }

  # --------------------------- 三、管理费用明细 ---------------------------

  - id: expense-travel
    desc: 差旅费
    kinds: [expense]
    priority: 520
    when:
      fieldContains: { category: [差旅费] }
    then:
      entries:
        - { side: debit, account: "6602.04", amount: net, summary: "{summary}", auxiliary: { department: "{field.department}" } }
        - { side: debit, account: "2221.01.01", amount: tax }
        - { side: credit, account: "{field.creditAccount}", amount: total }

  - id: expense-entertainment
    desc: 业务招待费
