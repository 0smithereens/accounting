# =============================================================================
# 税收优惠政策库（config/tax/benefits.yaml）
# =============================================================================
# 本文件承载「政策元数据」：文号、适用期间、优惠内容、人工确认清单。
# 判定逻辑（谁符合、减免多少）在 src/tax/benefits.ts 里，因为那是代码而非配置：
# 让运维用 YAML 改「谁可以享受优惠」等于让非专业人员改税法结论，风险不可控。
#
# 约定：
#   1. id 必须与 benefits.ts 中已实现判定逻辑的政策一一对应；
#      出现未知 id 会直接抛 TaxConfigError，避免「配置里写了、系统却不认」。
#   2. effectiveFrom / effectiveTo 为 YYYY-MM-DD；不写 effectiveTo 表示长期有效。
#   3. manualChecks 是必须由人确认、系统无法自动判定的事项，会原样展示给复核人。
# =============================================================================

meta:
  version: "2026.1"
  updatedAt: "2026-01-01"
  note: >-
    政策有效性以财政部、国家税务总局最新公告为准。本库仅覆盖系统已实现判定逻辑的政策，
    新增政策需同步在 src/tax/benefits.ts 中实现判定与测算。

policies:
  - id: cit-small-low-profit
    name: 小型微利企业所得税优惠（实际税负 5%）
    taxType: cit
    effectiveFrom: "2023-01-01"
    effectiveTo: "2027-12-31"
    content: >-
      对小型微利企业年应纳税所得额不超过 300 万元的部分，减按 25% 计入应纳税所得额，
      按 20% 的税率缴纳企业所得税，实际税负 5%。
    manualChecks:
      - 确认从事国家非限制和禁止行业
      - 确认从业人数不超过 300 人
      - 确认资产总额不超过 5000 万元
      - 留存备查：从业人数、资产总额计算表

  - id: vat-small-scale-reduction
    name: 小规模纳税人增值税减免（3% 减按 1%、月 10 万免征）
    taxType: vat
    effectiveFrom: "2023-01-01"
    effectiveTo: "2027-12-31"
    content: >-
      对月销售额 10 万元以下（含本数）的增值税小规模纳税人免征增值税；
      适用 3% 征收率的应税销售收入，减按 1% 征收率征收增值税。
    manualChecks:
      - 确认未超过小规模纳税人标准（年应税销售额 500 万元）
      - 确认用于判断免征的销售额为不含税销售额
      - 确认未开具增值税专用发票（专票部分不得免税）

  - id: surcharge-six-taxes-half
    name: 六税两费减半征收
    taxType: surcharge
    effectiveFrom: "2023-01-01"
    effectiveTo: "2027-12-31"
    content: >-
      对增值税小规模纳税人、小型微利企业和个体工商户减半征收资源税（不含水资源税）、
      城市维护建设税、房产税、城镇土地使用税、印花税（不含证券交易印花税）、
      耕地占用税和教育费附加、地方教育附加。
    manualChecks:
      - 确认纳税人身份属于小规模纳税人、小型微利企业或个体工商户之一
      - 确认所在地区是否有叠加的地方性减免政策

  - id: cit-rd-super-deduction
    name: 研发费用加计扣除 100%
    taxType: cit
    effectiveFrom: "2023-01-01"
    content: >-
      企业开展研发活动中实际发生的研发费用，未形成无形资产计入当期损益的，
      在按规定据实扣除的基础上，再按照实际发生额的 100% 在税前加计扣除。
    manualChecks:
      - 确认研发项目已立项并按项目设置辅助账归集
      - 确认不属于烟草制造、住宿餐饮、批发零售、房地产、租赁商务服务、娱乐业等负面清单行业
      - 剔除不适用加计扣除的费用（如其他相关费用超限额部分）

  - id: cit-high-tech
    name: 高新技术企业 15% 优惠税率
    taxType: cit
    effectiveFrom: "2008-01-01"
    content: 国家需要重点扶持的高新技术企业，减按 15% 的税率征收企业所得税。
    manualChecks:
      - 确认高新技术企业证书在有效期内（有效期三年）
      - 确认科技人员占职工总数比例不低于 10%
      - 确认研发费用占销售收入比例达到对应档位要求
      - 确认高新技术产品（服务）收入占比不低于 60%

  - id: cit-disabled-wage
    name: 安置残疾人员工资加计扣除
    taxType: cit
    effectiveFrom: "2008-01-01"
    content: >-
      企业安置残疾人员的，在按照支付给残疾职工工资据实扣除的基础上，
      可以在计算应纳税所得额时按照支付给残疾职工工资的 100% 加计扣除。
    manualChecks:
      - 确认已与残疾职工签订 1 年以上劳动合同并实际安置
      - 确认已为残疾职工足额缴纳社会保险
      - 确认通过银行等金融机构支付工资且不低于当地最低工资标准
      - 留存备查：残疾证、劳动合同、社保缴纳证明、工资支付凭证

  - id: cit-equipment-depreciation
    name: 设备器具一次性税前扣除（单价 500 万元以内）
    taxType: cit
    effectiveFrom: "2024-01-01"
    effectiveTo: "2027-12-31"
    content: >-
      企业新购进的设备、器具，单位价值不超过 500 万元的，
      允许一次性计入当期成本费用在计算应纳税所得额时扣除，不再分年度计算折旧。
    manualChecks:
      - 确认设备器具为 2024-01-01 之后新购进并已投入使用
      - 确认单位价值不超过 500 万元
      - 注意：一次性扣除属于时间性差异，不减少全周期税负

  - id: vat-additional-deduction
    name: 生产性/生活性服务业增值税加计抵减
    taxType: vat
    effectiveFrom: "2023-01-01"
    effectiveTo: "2027-12-31"
    content: >-
      生产性服务业纳税人按照当期可抵扣进项税额加计 5% 抵减应纳税额；
      生活性服务业纳税人按照当期可抵扣进项税额加计 10% 抵减应纳税额。
    manualChecks:
      - 确认四项服务销售额占全部销售额比重超过 50%
      - 确认加计抵减额未重复计入留抵税额
      - 确认上期未抵减完的加计抵减额已结转本期
