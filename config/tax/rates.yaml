# =============================================================================
# 税率配置（config/tax/rates.yaml）
# =============================================================================
# 本文件只覆盖「同一政策在不同地区、不同企业的差异参数」与政策切换期的临时口径。
# 法定税率的默认值、法规依据、生效日期登记在 src/tax/rates.ts 的常量表里，
# 两处必须同步修改，且改这里需要走配置变更审批（审计留痕）。
#
# 约定：
#   1. 比例一律写小数：13% 写 0.13，不要写 13 或 "13%"。
#   2. 金额阈值一律以「元」为单位书写（字段名带 Yuan 后缀），加载时自动换算为分。
#   3. 任何取值越界（如 1.3）都会让 loadTaxRates 抛 TaxConfigError，
#      系统不会带着可疑税率继续算税。
# =============================================================================

meta:
  version: "2026.1"
  updatedAt: "2026-01-01"
  reviewer: "待填写（配置变更需复核人签署）"
  note: >-
    依据《中华人民共和国增值税法》（2026-01-01 施行）、财政部 税务总局公告2023年第19号、
    2023年第12号、2023年第7号、国家税务总局公告2018年第61号等现行有效文件整理。

# -----------------------------------------------------------------------------
# 一、增值税
# -----------------------------------------------------------------------------
vat:
  # 一般纳税人适用税率，按应税项目分类。兼营必须分类计算，不能一刀切。
  standard:
    goods: 0.13              # 销售货物、进口货物
    processing: 0.13         # 加工修理修配劳务
    tangible_lease: 0.13     # 有形动产租赁
    transport: 0.09          # 交通运输服务
    postal: 0.09             # 邮政服务
    basic_telecom: 0.09      # 基础电信服务
    construction: 0.09       # 建筑服务
    real_estate: 0.09        # 不动产租赁、销售不动产、转让土地使用权
    agriculture: 0.09        # 农产品、食用植物油、食用盐等
    modern_service: 0.06     # 现代服务（研发技术、信息技术、鉴证咨询等）
    finance: 0.06            # 金融服务
    living_service: 0.06     # 生活服务
    intangible: 0.06         # 无形资产（技术、商标、著作权等）
    export: 0.0              # 出口货物、跨境应税行为
    small_scale_3: 0.03      # 小规模纳税人法定征收率
    small_scale_1: 0.01      # 小规模纳税人减按征收率（2023-2027）

  # 小规模纳税人法定征收率与减征率
  smallScale: 0.03
  smallScaleReduced: 0.01

  # 小规模纳税人免征增值税的销售额门槛（财政部 税务总局公告2023年第19号）
  exemptMonthlyThresholdYuan: 100000      # 月销售额 10 万元（含本数）
  exemptQuarterlyThresholdYuan: 300000    # 季度销售额 30 万元（含本数）

  # 生产性/生活性服务业加计抵减率。
  # 2023年第1号公告：生产性服务业 5%，生活性服务业 10%。
  # 本项目默认按 5% 统一测算；若企业属于生活性服务业，改为 0.10 并保留变更记录。
  additionalDeductionRate: 0.05

# -----------------------------------------------------------------------------
# 二、附加税费
# -----------------------------------------------------------------------------
surcharge:
  # 城市维护建设税：按纳税人所在地分档（城市维护建设税法第四条）
  city:
    city: 0.07      # 市区
    county: 0.05    # 县城、镇
    other: 0.01     # 不在市区、县城或镇
  education: 0.03           # 教育费附加 3%
  localEducation: 0.02      # 地方教育附加 2%
  halfRate: 0.5             # 六税两费减半：按 50% 征收

  # 月销售额 10 万元（季度 30 万元）以下免征教育费附加、地方教育附加（财税〔2016〕12号）
  educationExemptMonthlyThresholdYuan: 100000
  educationExemptQuarterlyThresholdYuan: 300000

# -----------------------------------------------------------------------------
# 三、企业所得税
# -----------------------------------------------------------------------------
cit:
  standard: 0.25            # 法定税率 25%
  highTech: 0.15            # 高新技术企业 15%

  # 小型微利企业：减按 25% 计入应纳税所得额，按 20% 税率缴纳 → 实际税负 5%
  # 依据：财政部 税务总局公告2023年第12号第三条（执行至 2027-12-31）
  smallLowProfit:
    inclusionRate: 0.25
    rate: 0.20
    maxTaxableIncomeYuan: 3000000    # 年应纳税所得额 ≤ 300 万元
    maxEmployees: 300                # 从业人数 ≤ 300 人
    maxAssetsYuan: 50000000          # 资产总额 ≤ 5000 万元

  # 税前扣除限额
  limits:
    businessEntertainment: 0.6             # 业务招待费按发生额 60%
    businessEntertainmentRevenue: 0.005    # 且不超过销售收入 5‰
    advertising: 0.15                      # 广告费和业务宣传费 15%
    welfare: 0.14                          # 职工福利费 14%
    education: 0.08                        # 职工教育经费 8%（财税〔2018〕51号）
    union: 0.02                            # 工会经费 2%
    donation: 0.12                         # 公益性捐赠 12%
    rdSuperDeduction: 1.0                  # 研发费用加计扣除 100%

# -----------------------------------------------------------------------------
# 四、个人所得税（工资薪金累计预扣法）
# -----------------------------------------------------------------------------
iit:
  basicDeductionMonthlyYuan: 5000    # 每月减除费用 5000 元

  # 个人所得税预扣率表一（居民个人工资、薪金所得预扣预缴适用）
  # 累计应纳税所得额 × 税率 - 速算扣除数
  brackets:
    - { upperYuan: 36000,    rate: 0.03, quickDeductionYuan: 0 }
    - { upperYuan: 144000,   rate: 0.10, quickDeductionYuan: 2520 }
    - { upperYuan: 300000,   rate: 0.20, quickDeductionYuan: 16920 }
    - { upperYuan: 420000,   rate: 0.25, quickDeductionYuan: 31920 }
    - { upperYuan: 660000,   rate: 0.30, quickDeductionYuan: 52920 }
    - { upperYuan: 960000,   rate: 0.35, quickDeductionYuan: 85920 }
    - { upperYuan: 999999999, rate: 0.45, quickDeductionYuan: 181920 }

# -----------------------------------------------------------------------------
# 五、印花税（中华人民共和国印花税法 附件《印花税税目税率表》）
# -----------------------------------------------------------------------------
stamp:
  rates:
    sale: 0.0003               # 买卖合同 价款的万分之三
    loan: 0.00005              # 借款合同 借款金额的万分之零点五
    lease: 0.001               # 租赁合同 租金的千分之一
    property_transfer: 0.0005  # 产权转移书据 价款的万分之五
    account_book: 0.00025      # 营业账簿 实收资本与资本公积合计的万分之二点五
    securities: 0.001          # 证券交易 成交金额的千分之一
    construction: 0.0003       # 建设工程合同 价款的万分之三
    transport: 0.0003          # 运输合同 运输费用的万分之三
    technology: 0.0003         # 技术合同 价款、报酬或使用费的万分之三
    insurance: 0.001           # 财产保险合同 保险费的千分之一
