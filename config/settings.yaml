# =============================================================================
# 全局设置
# =============================================================================

# 记账本位币
currency: CNY

# =============================================================================
# 会计准则（重要！决定整套核算口径）
#   cas    企业会计准则（财政部令第33号及后续修订、财会〔2006〕3号）
#          适用于：上市公司、大中型企业、需要融资/并表的企业
#          特点：递延所得税、公允价值、资产减值、研发资本化、收入五步法、权益法
#   small  小企业会计准则（财会〔2011〕17号）
#          适用于：符合《中小企业划型标准规定》的小型企业
#          特点：不确认递延所得税、不计提减值准备、研发支出全部费用化、
#                所得税用应付税款法、经营租赁不资本化
#
# 切换准则会同时切换：科目表、可用科目白名单、财务报表格式、审核检查集。
# 写错（非 cas/small）会直接报错，不会静默降级——用错科目表是最危险的配置错误。
# =============================================================================
accountingStandard: cas


# 凭证字（凭证号前缀），如「记-0001」
voucherWord: 记

# 是否把同一天的凭证合并为一张（false 表示按单据逐张生成，便于核对）
mergeByDate: false

# 单张凭证明细行上限，超过则自动拆分为多张凭证
maxLinesPerVoucher: 100

# 未识别到税率时使用的默认税率（0.06 = 6%）
defaultTaxRate: 0.06

# 兜底科目：规则未覆盖或借贷不平时临时挂账，必须人工清理
suspenseAccount: "1901"

# -----------------------------------------------------------------------------
# 报销单的贷方科目（重要！决定了会不会重复记账）
#   "2241.04" 先挂「其他应付款-员工报销款」，银行付款时再冲减。
#             ★ 同时处理银行流水时必须用这个，否则银行存款会被记两次。
#   "1002"    视为报销时已直接付款。只处理报销单、不导入银行流水时用这个。
# -----------------------------------------------------------------------------
expenseCreditAccount: "2241.04"

# 是否自动删除金额为 0 的分录行（规则模板里常见的空税/空社保行）
dropZeroLines: true

# -----------------------------------------------------------------------------
# 本企业名称（重要！）
# 用于判断发票是「进项」还是「销项」、Word 合同里我方是甲方还是乙方。
# 必须填写，否则发票与合同无法自动判断方向，会进入人工复核队列。
# 请改成你公司的工商全称，可填多个（多主体/分子公司）。
# -----------------------------------------------------------------------------
companyNames:
  - 示例科技有限公司

# 已知部门列表：用于从摘要/报销人中识别部门辅助核算。
# 写得越全，辅助核算越准；写不全时系统会尝试用「XX部/XX中心」等后缀猜测。
departments:
  - 总经办
  - 财务部
  - 人力资源部
  - 行政部
  - 销售部
  - 市场部
  - 采购部
  - 技术部
  - 研发部
  - 生产部
  - 品质部
  - 物流部
  - 客服部
