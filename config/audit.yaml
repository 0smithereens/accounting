# =============================================================================
# 审计留痕与版本库配置
#
# 三条铁律（写在代码里，不通过配置开关）：
#   1. 账务数据永不物理删除：Delete 一律软删除，Update 一律追加历史版本。
#   2. 审计事件只追加、带哈希链，任何一条被改动都会断链并定位到 seq。
#   3. 已结账期间冻结，反结账必须写明理由并留痕。
#
# 法规依据：
#   《中华人民共和国会计法》第九条：各单位必须根据实际发生的经济业务事项进行会计核算。
#   《中华人民共和国会计法》第十四条：会计凭证、会计账簿必须真实、完整。
#   《会计档案管理办法》（财政部 国家档案局令第 79 号）第十四条：会计凭证、账簿保存 30 年。
#   《企业内部控制基本规范》（财会〔2008〕7 号）第四十一条：业务记录应当以适当方式保存。
# =============================================================================

version: 1

storage:
  # 审计库根目录（相对项目根目录；也可写绝对路径）
  dataDir: data/audit
  # 哈希算法：固定 sha256。换算法会让已有哈希链无法校验，代码里会拒绝其它取值
  hashAlgorithm: sha256
  # 每次追加后是否 fsync。生产环境必须为 true：宕机时宁可慢一点，也不能丢审计记录
  fsync: true

retention:
  # 会计档案最低保存年限。低于法定年限时，导出/归档环节应给出提示
  years: 30
  # 保存年限的法规依据，随配置一起展示，避免出现「只写数字没有出处」的结论
  basis:
    - id: accounting-archives-79
      title: 会计档案管理办法
      article: 第十四条
      excerpt: 会计凭证、会计账簿等会计档案的保管期限为 30 年
      level: departmental-rule
    - id: accounting-law
      title: 中华人民共和国会计法
      article: 第九条
      excerpt: 各单位必须根据实际发生的经济业务事项进行会计核算，不得以虚假的经济业务事项或者资料进行会计核算
      level: law

lock:
  # 是否启用期间锁账。生产环境必须为 true；仅数据迁移时可临时关闭
  enabled: true
  # 结账是否必须由人工签署。为 true 时，以「系统」身份结账会被拒绝：
  # AI 只能生成结账建议与草稿，签署结账必须由会计人员完成
  requireHumanSignature: true
  # 结账前必须清零的兜底科目（未清理干净不得结账）
  # 说明：反结账必须填写理由是代码里的硬约束，不提供关闭开关
  suspenseAccounts:
    - "1901"

entities:
  # 必须纳入版本管理的实体（与 core/contracts.ts 的 EntityKind 一一对应）
  tracked:
    - voucher
    - voucher_line
    - document
    - account
    - tax_return
    - statement
    - policy
    - settings
    - user
    - period_close
  # 更新这些实体时必须填写变更摘要，否则拒绝写入
  requireSummary:
    - tax_return
    - statement
