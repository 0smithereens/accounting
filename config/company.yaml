# =============================================================================
# 企业主体档案（税务与报表口径的唯一来源）
# =============================================================================
# 这个文件决定「按谁的身份算税」。填错会导致税率、优惠、申报表全错，
# 所以每一项都写清了判断依据，请对照营业执照与税务登记信息填写。
# =============================================================================

company:
  # 工商全称（与营业执照一致）。发票判断进项/销项、合同判断甲乙方都依赖它，
  # 它同时会注入到 settings.yaml 的 companyNames 里。
  name: 示例科技有限公司

  # 统一社会信用代码（18 位）。申报表抬头与归档用，不校验真伪。
  taxId: "91310000MA1FL0000X"

  # 纳税人身份（决定增值税算法，影响最大的一项）
  #   general      一般纳税人：销项-进项，可抵扣进项，税率 13%/9%/6%
  #   small_scale  小规模纳税人：征收率 3%（2023-2027 减按 1%），不得抵扣进项，
  #                月销售额 10 万（季度 30 万）以下免征
  kind: small_scale

  # 城建税税率，按纳税人所在地确定（城市维护建设税法第四条）
  #   0.07  市区
  #   0.05  县城、镇
  #   0.01  其他（不在市区、县城或镇）
  cityTaxRate: 0.07

  # 行业（用于风险扫描的税负率基准、财务分析的行业参考区间）
  industry: 软件和信息技术服务业

  # 从业人数与资产总额：判定小型微利企业、以及中小企业划型
  employees: 45
  totalAssets: 8000000        # 元

  # 是否高新技术企业（企业所得税 15%）
  isHighTech: false

  # 是否小型微利企业（年应纳税所得额≤300万、从业人数≤300、资产总额≤5000万）
  # 拿不准就填 true 并让审核引擎去校验，它会比对实际数据后给出告警。
  isSmallLowProfit: true

  # 本年度研发费用（元）。研发费用加计扣除 100% 的基数。
  rdExpense: 500000

  # 所在地区行政区划代码（前 2 位为省），用于地方政策匹配
  region: "310000"

  # 会计年度结束日（中国法定为 12-31，一般不改）
  fiscalYearEnd: "12-31"

  # 增值税计税方法（仅一般纳税人生效）
  #   general  一般计税（销项-进项）
  #   simple   简易计税（征收率）
  vatMethod: general
