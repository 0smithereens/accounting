# =============================================================================
# 会计科目表 —— 企业会计准则（一般企业）
# =============================================================================
# 制定依据：
#   《企业会计准则——应用指南》（财会〔2006〕18 号）附录「会计科目和主要账务处理」，
#   并按后续修订补充：
#     · 财会〔2014〕7 号  —— 新增「其他综合收益」科目
#     · 财会〔2017〕7 号  —— 金融工具确认和计量（1501/1502/1503/1504）
#     · 财会〔2017〕22 号 —— 收入（合同资产/合同负债，实务中用「应收账款」「预收账款」明细替代）
#     · 财会〔2017〕30 号 —— 新增「资产处置损益」科目
#     · 财会〔2018〕35 号 —— 租赁（使用权资产、租赁负债）
#
# 与旧科目表 config/chart-of-accounts.yaml 的关系：
#   本文件是旧表的**超集**：旧表所有科目编码、名称、辅助核算、defaultChild 全部原样保留，
#   因此 config/mappings/*.yaml 里的记账规则无需任何修改即可继续使用。
#   凡旧表中「有下级、且规则会引用」的上级科目（1002 银行存款 / 1221 其他应收款 /
#   6001 主营业务收入），本文件都保留了 defaultChild，保证规则引用上级科目时仍能
#   自动下钻到明细科目。
#
# ⚠ 编码重号警告（写跨准则代码时必读）：
#   两套准则的编码体系不同——企业会计准则 1/2/3(无)/4 权益/5 成本/6 损益，
#   小企业会计准则 1 资产/2 负债/3 权益/4 成本/5 损益。
#   同一编码在另一套准则里可能指向完全不同的科目：
#     4001 = 企业会计准则「实收资本」        = 小企业会计准则「生产成本」
#     4301 = 企业会计准则「其他综合收益」？  = 小企业会计准则「研发支出」
#     5301 = 企业会计准则「研发支出」        = 小企业会计准则「营业外收入」
#   所以准则切换时的科目准入判定必须「编码 + 名称」一起比，见
#   src/core/standard/profiles.ts 的 checkAccountAllowed()。
#
# 字段说明（与旧表完全一致）：
#   code        科目编码，用 . 分隔层级
#   name        科目名称
#   category    asset 资产 / liability 负债 / equity 所有者权益 / cost 成本 / profit 损益
#   balanceSide debit 借方余额 / credit 贷方余额（不填按 category 推断）
#   parent      上级科目编码（不填按编码前缀自动推断）
#   leaf        是否为明细科目（不填则自动推断：有下级即非明细）
#   defaultChild 默认下钻的明细科目（规则引用上级科目时自动改用）
#   auxiliary   允许的辅助核算维度：department/customer/supplier/employee/project
#   note        备注（写清为什么这样设，而不是复述科目名）
#
# 维护约定：
#   1. 新增科目只往下加，不要改已有 code / name：改 code 会让历史凭证与规则失效。
#   2. 已被 config/mappings 引用的编码不得变为「有下级但无 defaultChild」，
#      否则生成凭证时会告警「科目还有下级且未配置 defaultChild」。
#   3. 「使用权资产」「租赁负债」「资产处置损益」「其他综合收益」等新准则科目的编号
#      财政部的应用指南未统一规定，本表选用的是应用指南里的**空号**（1612/1613、
#      2703、6115、4003），不与既有科目冲突，切换时只需与账套设置保持一致。
# =============================================================================

