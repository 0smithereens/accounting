# =============================================================================
# 编号映射：企业会计准则 → 小企业会计准则
# =============================================================================
# 为什么需要这张表：
#  两套准则的科目编码体系不同，而且存在大量「同号不同义」——
#    4001 企业准则=实收资本，小企业准则=生产成本
#    5001 企业准则=生产成本，小企业准则=主营业务收入
#    5301 企业准则=研发支出，小企业准则=营业外收入
#  如果只按编码匹配，小企业准则下会把「实收资本」记成「生产成本」，是最严重的错账。
#
# 规则：
#  1. 先查本表（长编码优先），命中即用；to: null 表示该准则下无此业务，相关规则停用。
#  2. 本表没覆盖的编码，再按「目标科目表是否存在 → 逐级去掉末段找上级」回退。
#  3. 明细科目（如 6602.10）会先用 6602 的映射，落到 5602，明细由企业在目标准则下自设。
#
# 业务规则（config/mappings/*.yaml）只需维护**企业会计准则**一套，
# 切到小企业准则时由 src/core/remap.ts 自动改写科目编码。
# =============================================================================

map:
  # ---------------------------- 资产类 ----------------------------
  - { from: "1001", to: "1001" }
  - { from: "1002", to: "1002" }
  - { from: "1012", to: "1012" }
  - { from: "1101", to: "1101", note: "交易性金融资产 → 短期投资（按成本计量）" }
  - { from: "1121", to: "1121" }
  - { from: "1122", to: "1122" }
  - { from: "1123", to: "1123" }
  - { from: "1131", to: "1131" }
  - { from: "1132", to: "1132" }
  - { from: "1221", to: "1221" }
  - { from: "1231", to: null, note: "坏账准备：小企业准则不计提资产减值准备，坏账直接转销" }
  - { from: "1401", to: "1401" }
  - { from: "1402", to: "1402" }
  - { from: "1403", to: "1403" }
  - { from: "1405", to: "1405" }
  - { from: "1408", to: "1408" }
  - { from: "1471", to: null, note: "存货跌价准备：不计提" }
  - { from: "1501", to: "1501", note: "持有至到期投资 → 长期债券投资" }
  - { from: "1511", to: "1511", note: "长期股权投资（小企业一律成本法）" }
  - { from: "1521", to: "1601", note: "投资性房地产：小企业准则在固定资产/无形资产中核算" }
  - { from: "1531", to: null, note: "长期应收款：小企业准则无此科目，分期收款在 2202/1122 反映" }
  - { from: "1601", to: "1601" }
  - { from: "1602", to: "1602" }
  - { from: "1603", to: null, note: "固定资产减值准备：不计提" }
  - { from: "1604", to: "1604" }
  - { from: "1605", to: "1605" }
  - { from: "1606", to: "1606" }
  - { from: "1701", to: "1701" }
  - { from: "1702", to: "1702" }
  - { from: "1703", to: null, note: "无形资产减值准备：不计提" }
  - { from: "1801", to: "1801" }
  - { from: "1811", to: null, note: "递延所得税资产：小企业准则用应付税款法，不确认" }
  - { from: "1901", to: "1901" }

  # ---------------------------- 负债类 ----------------------------
  - { from: "2001", to: "2001" }
  - { from: "2201", to: "2201" }
  - { from: "2202", to: "2202" }
  - { from: "2203", to: "2203" }
  - { from: "2211", to: "2211" }
  - { from: "2221", to: "2221" }
  - { from: "2231", to: "2231" }
  - { from: "2232", to: "2232", note: "应付股利 → 应付利润（同号，科目名不同）" }
  - { from: "2241", to: "2241" }
  - { from: "2401", to: "2401" }
  - { from: "2501", to: "2501" }
  - { from: "2701", to: "2701" }
  - { from: "2901", to: null, note: "递延所得税负债：不确认" }

  # ------------------------- 所有者权益类 -------------------------
  - { from: "4001", to: "3001", note: "实收资本：编码由 4001 变为 3001（4001 在小企业准则是生产成本）" }
  - { from: "4002", to: "3002", note: "资本公积" }
  - { from: "4101", to: "3101", note: "盈余公积" }
  - { from: "4103", to: "3103", note: "本年利润" }
  - { from: "4104", to: "3104", note: "利润分配" }
  - { from: "4201", to: null, note: "库存股：小企业准则不涉及股份支付与库存股" }

  # ---------------------------- 成本类 ----------------------------
  - { from: "5001", to: "4001", note: "生产成本：5001 → 4001" }
  - { from: "5101", to: "4101", note: "制造费用" }
  - { from: "5201", to: "4001", note: "劳务成本：并入生产成本（小企业准则允许将 4001 改为劳务成本）" }
  - { from: "5301", to: "4301", note: "研发支出：5301 → 4301（5301 在小企业准则是营业外收入）" }
  - { from: "5401", to: "4401", note: "工程施工" }
  - { from: "5402", to: null, note: "工程结算：小企业准则无此科目，按 4401 工程施工核算" }
  - { from: "5403", to: "4403", note: "机械作业" }

  # ---------------------------- 损益类 ----------------------------
  - { from: "6001", to: "5001", note: "主营业务收入：6001 → 5001" }
  - { from: "6051", to: "5051", note: "其他业务收入" }
  - { from: "6101", to: null, note: "公允价值变动损益：小企业准则不采用公允价值计量" }
  - { from: "6111", to: "5111", note: "投资收益" }
  - { from: "6301", to: "5301", note: "营业外收入：6301 → 5301（5301 在小企业准则是营业外收入，不是研发支出）" }
  - { from: "6401", to: "5401", note: "主营业务成本" }
  - { from: "6402", to: "5402", note: "其他业务成本" }
  - { from: "6403", to: "5403", note: "税金及附加" }
  - { from: "6601", to: "5601", note: "销售费用" }
  - { from: "6602", to: "5602", note: "管理费用（研发费用、开办费、业务招待费均在此列支）" }
  - { from: "6603", to: "5603", note: "财务费用" }
  - { from: "6701", to: null, note: "资产减值损失：小企业准则不计提减值" }
  - { from: "6702", to: null, note: "信用减值损失：小企业准则不计提" }
  - { from: "6711", to: "5711", note: "营业外支出" }
  - { from: "6801", to: "5801", note: "所得税费用（应付税款法）" }
  - { from: "6901", to: null, note: "以前年度损益调整：小企业准则用未来适用法，不追溯调整" }
