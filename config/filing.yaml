# =============================================================================
# 申报工作流与人工复核（Human-in-the-loop）配置
# =============================================================================
# 为什么要有这个文件？
#   税务计算可以由 AI 生成，但「算得对不对」和「报不报」是两个不同的责任：
#   前者可以由系统辅助，后者必须由具体的人承担法律后果。
#   因此本系统里所有申报表都只能是草稿，必须走完
#       制单（计算） → 复核 → 审批 → 导出底稿 → 人工在电子税务局申报 → 回填回执
#   这条链路。本文件控制链路的强制程度，改这里不需要改代码。
#
# 不可关闭的红线（写在代码里，不在此配置）：
#   · 系统绝不自动向税务机关提交申报（submitToTaxBureau() 恒抛异常）；
#   · 未到「已审批」状态不得导出申报底稿；
#   · filed 只能由人工申报回执回填，不能由任何自动流程写入。
# =============================================================================

version: 1

workflow:
  # 四眼原则：审批人不得与复核人相同。
  # 关闭它等于允许一个人既复核又审批，属于内控缺陷。除非企业规模极小且在
  # 书面制度里已明确授权，否则不要关闭。
  fourEyes: true

  # 是否允许复核人 = 制单人（自我复核）。
  # 默认 false：自己算的税自己复核，等于没有复核。
  allowSelfReview: false

  # 进入复核前是否必须存在审核报告（reviewId 非空）。
  # 打开后，税务引擎必须先跑完审核并写回 reviewId，复核人才签得下去。
  requireReviewReport: true

  # 是否要求制单人签署（calculate 时自动记录一条 preparer 签名）。
  requirePreparerSignature: true

  # 作废理由的最短字数。作废一张已审批的申报表等于推翻一次审批，理由必须写清楚。
  minVoidReasonLength: 4

  # 已申报后是否仍允许作废。
  # 作废只改状态、不删除数据；但已申报的申报表若需更正，应到电子税务局办理更正申报。
  allowVoidAfterFiled: true

# -----------------------------------------------------------------------------
# 角色定义
# 只描述职责，不做权限系统（权限由 Web 层的登录态决定）。
# -----------------------------------------------------------------------------
roles:
  preparer:
    label: 制单人（税务会计）
    description: 负责税额计算与申报表填制，对计算口径负责。
    actions: [calculate, revise]
  reviewer:
    label: 复核人（税务主管）
    description: 独立复核计算过程与法规依据，对「算得对不对」负责。
    actions: [review, reject]
  approver:
    label: 审批人（财务负责人）
    description: 对「报不报、报多少」做最终决定，并负责对接人工申报与回执回填。
    actions: [approve, exportForFiling, reportManualFiling, void]

# -----------------------------------------------------------------------------
# 申报必备材料（导出底稿时作为「申报前自查清单」打印在第三张表上）
# 每条都要带法规依据：合规结论没有依据就等于没有结论。
# -----------------------------------------------------------------------------
requiredMaterials:
  - id: calculation-sheet
    label: 税额计算表（每一栏次的计算过程）
    required: true
    description: 证明应纳税额是怎么算出来的，供复核人逐栏核对。
    basis:
      - id: tax-collection-law
        title: 中华人民共和国税收征收管理法
        article: 第二十五条
        excerpt: 纳税人必须依照法律、行政法规规定或者税务机关依照法律、行政法规的规定确定的申报期限、申报内容如实办理纳税申报。
        level: law
      - id: accounting-basis-work
        title: 会计基础工作规范
        article: 第六十一条
        excerpt: 各单位应当建立、健全本单位内部会计监督制度，明确记账人员与经济业务事项和会计事项的审批人员、经办人员、财物保管人员的职责权限。
        level: departmental-rule

  - id: invoice-summary
    label: 进销项发票汇总表（含作废与红冲）
    required: true
    description: 增值税申报的销项、进项数据来源，须与开票系统、认证结果一致。
    basis:
      - id: vat-temporary-regulations
        title: 中华人民共和国增值税暂行条例
        article: 第二十二条
        excerpt: 纳税人的纳税义务发生时间、销售额和销项税额应当依照本条例规定确定。
        level: administrative-regulation

  - id: approval-record
    label: 内部审批记录（复核与审批签署）
    required: true
    description: 证明申报数据经过独立复核与授权审批，是内控留痕的核心证据。
    basis:
      - id: accounting-law
        title: 中华人民共和国会计法
        article: 第二十一条
        excerpt: 单位负责人应当保证会计机构、会计人员依法履行职责，不得授意、指使、强令会计机构、会计人员违法办理会计事项。
        level: law

  - id: prior-payment
    label: 上期完税凭证（用于核对已预缴税额）
    required: false
    description: 核对预缴税额，避免重复缴税或漏抵。
    basis:
      - id: tax-collection-law
        title: 中华人民共和国税收征收管理法
        article: 第三十四条
        excerpt: 税务机关征收税款时，必须给纳税人开具完税凭证。
        level: law

# -----------------------------------------------------------------------------
# 导出设置
# -----------------------------------------------------------------------------
export:
  # 导出文件名前缀，实际文件名为「申报底稿_税种_期间_版本.xlsx」
  filePrefix: 申报底稿

  # 每一份导出文件的第一行都会打印这句话。
  # 拿到 Excel 的人第一眼就要知道「这不是申报成功凭证」。
  declaration: 本文件为申报底稿，需由人工在电子税务局核对后自行申报，系统不代为提交。
